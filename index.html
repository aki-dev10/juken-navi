<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="受験ナビ">
<title>受験ナビ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#222;--sub:#667;--line:#e3e5ee;--accent:#4f6bed;--accent2:#ef7b5c;--ok:#2e9e6a;--ng:#d14b4b}
@media (prefers-color-scheme: dark){:root{--bg:#15171e;--card:#1f222b;--text:#eee;--sub:#99a;--line:#333846;--accent:#7b93ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{padding:14px 16px 4px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;max-width:960px;margin:0 auto}
header h1{font-size:20px;margin:0}
header .cd{font-size:13px;color:var(--sub)}
main{max-width:960px;margin:0 auto;padding:8px 16px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);z-index:10;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 2px 10px;font-size:11px;color:var(--sub);cursor:pointer}
nav button .i{display:block;font-size:20px}
nav button.on{color:var(--accent);font-weight:bold}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
h2{font-size:17px;margin:4px 0 8px}
h3{font-size:15px;margin:14px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.sbtn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:14px 8px;font-size:14px;cursor:pointer;text-align:center}
.sbtn:hover,.sbtn.on{border-color:var(--accent);color:var(--accent)}
.sbtn small{display:block;color:var(--sub);font-size:11px;margin-top:4px}
.muted{color:var(--sub);font-size:13px}
.soon{display:inline-block;background:var(--accent2);color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;margin-left:6px;vertical-align:middle}
a{color:var(--accent)}
input,select,textarea{font:inherit;font-size:16px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);max-width:100%}
button.b{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px}
button.g{background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
button.x{background:none;border:0;color:var(--ng);cursor:pointer;font-size:14px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px;text-align:center;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
.pass{color:var(--ok);font-weight:bold}.fail{color:var(--ng);font-weight:bold}
.todo{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line)}
.todo.done span{text-decoration:line-through;color:var(--sub)}
.todo span{flex:1}
.sub-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.sub-tabs button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:20px;padding:5px 12px;cursor:pointer;font-size:13px}
.sub-tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.ev{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.tag{font-size:11px;border-radius:6px;padding:1px 6px;color:#fff;white-space:nowrap}
.t-school{background:#4f6bed}.t-jishu{background:#2e9e6a}.t-other{background:#999}.t-gcal{background:#ef7b5c}
.hidden{display:none!important}
.next{background:linear-gradient(135deg,#4f6bed,#7b5cef);color:#fff;border:0}
.next .big{font-size:28px;font-weight:bold}
.qcard{text-align:center;padding:24px 12px}
.qcard .q{font-size:20px;margin:12px 0 18px;line-height:1.6}
.qcard .a{font-size:18px;color:var(--accent);font-weight:bold;margin:10px 0}
.qcard .ex{font-size:13px;color:var(--sub)}
.qbtns{display:flex;gap:10px;justify-content:center;margin-top:16px}
.qbtns button{font-size:18px;padding:12px 28px;border-radius:12px;border:0;color:#fff;cursor:pointer}
.ok{background:var(--ok)}.ng{background:var(--ng)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
#login{max-width:360px;margin:15vh auto;text-align:center;padding:0 16px}
#login input{font-size:24px;text-align:center;letter-spacing:8px;width:180px}
#sync{position:fixed;top:8px;right:8px;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2px 8px;color:var(--sub)}
</style>
</head>
<body>
<div id="login">
  <h1>🌸 受験ナビ</h1>
  <p class="muted">パスワードを入力してね</p>
  <input id="pw" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8">
  <div style="margin-top:12px"><button class="b" id="loginBtn">ひらく</button></div>
  <p class="muted" id="loginMsg"></p>
</div>

<div id="app" class="hidden">
  <div id="sync"></div>
  <header>
    <h1 id="title">🌸 受験ナビ</h1>
    <div class="cd" id="countdown"></div>
  </header>
  <main>
    <section id="tab-school"></section>
    <section id="tab-ielts" class="hidden"></section>
    <section id="tab-kyotsu" class="hidden"></section>
    <section id="tab-record" class="hidden"></section>
    <section id="tab-info" class="hidden"></section>
  </main>
  <nav>
    <button data-tab="school" class="on"><span class="i">📚</span>定期テスト</button>
    <button data-tab="ielts"><span class="i">🌍</span>IELTS</button>
    <button data-tab="kyotsu"><span class="i">🎯</span>共通テスト</button>
    <button data-tab="record"><span class="i">📈</span>成績</button>
    <button data-tab="info"><span class="i">📅</span>Info</button>
  </nav>
</div>

<script>
// ===== 設定 =====
const API = "https://script.google.com/macros/s/AKfycbznBKX6lJgRgamCGfco9nRSzC3EET2pfI6mM79XjkVqDZj2ThZkwkKFpAcnmz9TB3o4Eg/exec";
const DRIVE = {
  ielts: "1EnyaRj0QMfQXKicInfWUrfxXIQrHFs9I",
  kyotsu: "1glSSGQGMR8foG5S6x8dgo2sixQHrl2wT",
  record: "1i4hUu34M8jdk-VDEoR0XR8nEAhBuRb_S",
  recTest: "1ijpCIeKRxVHH32bwUk0iNE-CFW4AoOE1",
  recMoshi: "1nGVof_IEqdF6SKl9EJ0fz-ZLJ4ME65k9",
  recEiken: "1Pw6QYK6K4pKep1Jv_fa6SQBLRjEnQksN",
  recIelts: "17e2Oz7rrBmV1sDeiWZ1cpwpJXbCfBIsJ",
  calSchool: "1lfj7OmKwEGau1vM-sMNNqT4nnUrCobnP",
  calJishu: "1FtxI97OR__0dCNeSbZTJKuwSTLCQqI3L",
  sheet: "15XzDSWNqT49h-D4K4WpXGoIJ9wPE3aMTzbdItWi95hM",
};
const driveUrl = id => `https://drive.google.com/drive/folders/${id}`;
const sheetUrl = `https://docs.google.com/spreadsheets/d/${DRIVE.sheet}/edit`;

const FOLDERS = {
  "英語コミュ":"1Ha4nEf0io03Rr0ayr9ajJ8waknQEoctY", "論理・表現":"1xgbFKXZG7tvzlqkqWoW8_9HAv-wqiqo4",
  "数学I":"1kshZORnHh9iamhfM8c9fxKSap7QRMJNY", "数学A":"1x6N87SEtsVg1cSEvxKZavmPR1Ihvx4JY",
  "現代の国語":"1b0hvr8Hy9dx88y1LgzEhJKz83fewzsUM", "言語文化":"1aj4ndkPDs-sWk_jVeCZDSZgrpZgUKl4u",
  "公共":"1scyFpz7c2EPRJWwkY4Fn9c97vfJBPlbE", "歴史総合":"19KpPsGPBB3MP5HItRCwm8gpfbof0WKxE",
  "情報I":"1979FKVrKUgnVbCOYd1PWjbfgNrGf58DX", "生物基礎":"1SMVeNnGxQxhJjseF7Afe1Ic6PfL2nxwW",
  "物理基礎":"1DuhlbyJ__xH0YL39mLpO7kRDW_e7X8V-", "保健":"1T9zhkIG2oX1pYe6eqHU0NFpAhFWZsZqp",
};
const NOTES = {"物理基礎":"共通テストでは使用しない予定"};
const KYOTSU = ["英語","数学","国語","歴史総合・日本史探究","公共・政治経済","情報I","化学基礎・生物基礎"];
const KYOTSU_DATE = new Date("2029-01-13T09:00:00+09:00"); // 目安（例年1月中旬の土日）

// ===== 共通 =====
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => new Date(Date.now() + 9*3600e3).toISOString().slice(0,10);
const daysTo = d => Math.ceil((new Date(d + "T00:00:00+09:00") - Date.now()) / 864e5);
const num = v => v === "" || v == null || isNaN(Number(v)) ? null : Number(v);
const store = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
                set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

// ===== データ（スプレッドシート ⇔ アプリ） =====
// S[シート名] = {headers, rows:[{見出し:値}]}
let S = {}, EVENTS = [], PWD = "";
async function api(body){
  const r = await fetch(API, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({pw:PWD, ...body})});
  return r.json();
}
function fromRaw(raw){
  const o = {};
  for (const [name, {headers, rows}] of Object.entries(raw))
    o[name] = {headers, rows: rows.map(r => Object.fromEntries(headers.map((h,i) => [h, r[i] ?? ""])))};
  return o;
}
const T = name => S[name]?.rows || [];
const timers = {};
function save(name){
  store.set("cache", {sheets:S, events:EVENTS});
  clearTimeout(timers[name]);
  setSync("保存待ち…");
  timers[name] = setTimeout(async () => {
    const {headers, rows} = S[name];
    try {
      const r = await api({action:"save", sheet:name, rows: rows.map(o => headers.map(h => o[h] ?? ""))});
      setSync(r.ok ? "✓ 保存しました" : "⚠ 保存失敗", !r.ok);
    } catch { setSync("⚠ オフライン（保存できません）", true); }
  }, 800);
}
function setSync(t, keep){ const el = $("#sync"); el.textContent = t; el.classList.remove("hidden"); if (!keep) setTimeout(() => el.classList.add("hidden"), 2500); }

// ===== ログイン =====
async function login(pw){
  PWD = pw; $("#loginMsg").textContent = "読み込み中…";
  try {
    const r = await api({action:"load"});
    if (!r.ok) { $("#loginMsg").textContent = r.error === "locked" ? "しばらく待ってからやり直してね" : "パスワードがちがいます"; store.set("pw", null); return; }
    S = fromRaw(r.sheets); EVENTS = r.events || [];
    store.set("pw", pw); store.set("cache", {sheets:S, events:EVENTS});
    start();
  } catch {
    const c = store.get("cache");
    if (c && store.get("pw") === pw) { S = c.sheets; EVENTS = c.events || []; start(); setSync("⚠ オフライン表示中", true); }
    else $("#loginMsg").textContent = "通信エラー。ネット接続を確認してね";
  }
}
$("#loginBtn").onclick = () => login($("#pw").value);
$("#pw").onkeydown = e => { if (e.key === "Enter") login($("#pw").value); };
if (store.get("pw")) login(store.get("pw"));

function start(){
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  $("#title").textContent = "🌸 詩の受験ナビ";
  $("#countdown").textContent = `共通テストまで あと約 ${daysTo(KYOTSU_DATE.toISOString().slice(0,10))} 日`;
  RENDER[cur]();
}

// ===== タブ =====
let cur = "school";
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  cur = b.dataset.tab;
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll("main section").forEach(s => s.classList.toggle("hidden", s.id !== "tab-" + cur));
  RENDER[cur]();
});

// 学年・科目・テスト（向上高校は前期/後期制）
const GRADE = "1";
const TESTS = ["前期中間①","前期期末","後期中間①","後期中間②","後期期末","後期学年末"];
const FINAL_ONLY = ["情報I"];
const subjects = () => Object.keys(FOLDERS);
const tests = () => TESTS;
const na = (subj, test) => FINAL_ONLY.includes(subj) && test.includes("中間");
const score = (subj, test) => T("定期テスト").find(r => String(r["学年"]) === GRADE && r["テスト"] === test && r["教科"] === subj);
function nextTest(){
  const t = today();
  return T("テスト日程").filter(r => r["終了日"] >= t).sort((a,b) => a["開始日"].localeCompare(b["開始日"]))[0];
}

// ===== ① 定期テスト =====
let curSubj = null, quiz = null;
function renderSchool(){
  const el = $("#tab-school");
  if (quiz) return renderQuiz();
  const nt = nextTest();
  const todos = T("やること");
  el.innerHTML = `
    ${nt ? `<div class="card next"><div>次のテスト：<b>${esc(nt["テスト"])}</b>（${esc(nt["開始日"].slice(5).replace("-","/"))}〜${esc(nt["終了日"].slice(5).replace("-","/"))}）</div>
      <div class="big">${daysTo(nt["開始日"]) > 0 ? `あと ${daysTo(nt["開始日"])} 日` : "テスト期間中！がんばれ！"}</div>
      <div style="font-size:13px;margin-top:4px">🏫 今日の自習室：${esc(jishuText(jishu(today())))}</div></div>` : ""}
    <div class="card">
      <h2>📚 向上高校 定期テスト対策（1年）</h2>
      <div class="grid">${subjects().map(s => {
        const td = todos.filter(t => t["教科"] === s), qs = T("問題").filter(q => q["教科"] === s);
        return `<button class="sbtn ${curSubj===s?"on":""}" data-s="${esc(s)}">${esc(s)}
          <small>${na(s, tests()[0]) ? "期末のみ" : "中間・期末"}${td.length ? ` ／ ✅${td.filter(t=>t["完了"]==="TRUE").length}/${td.length}` : ""}${qs.length ? ` ／ 🧠${qs.length}` : ""}</small></button>`;
      }).join("")}</div>
    </div>
    <div id="subjDetail"></div>`;
  el.querySelectorAll(".sbtn").forEach(b => b.onclick = () => { curSubj = b.dataset.s; renderSchool(); $("#subjDetail").scrollIntoView({behavior:"smooth"}); });
  if (curSubj) renderSubject();
}
function renderSubject(){
  const s = curSubj, box = $("#subjDetail");
  const todos = T("やること").filter(t => t["教科"] === s);
  const memo = T("範囲メモ").find(m => m["教科"] === s);
  const qs = T("問題").filter(q => q["教科"] === s);
  const units = [...new Set(qs.map(q => q["単元"]).filter(Boolean))];
  const ts = tests().filter(t => !na(s, t));
  const tried = qs.filter(q => num(q["出題数"]) > 0);
  const rate = tried.length ? Math.round(100 * tried.reduce((a,q)=>a+num(q["正解数"]),0) / tried.reduce((a,q)=>a+num(q["出題数"]),0)) : null;
  box.innerHTML = `
    <div class="card">
      <h2>${esc(s)}</h2>
      <p class="muted">${na(s, tests()[0]) ? "※ 期末テストのみ実施" : "中間テスト・期末テスト"}${NOTES[s] ? "　※ " + NOTES[s] : ""}
        ／ <a href="${driveUrl(FOLDERS[s])}" target="_blank" rel="noopener">📁 教材フォルダ</a></p>

      <h3>🧠 一問一答（${qs.length}問${rate !== null ? `・正答率 ${rate}%` : ""}）</h3>
      ${qs.length ? `<div class="row">
        <select id="qUnit"><option value="">すべての単元</option>${units.map(u=>`<option>${esc(u)}</option>`).join("")}</select>
        <select id="qMode"><option value="weak">苦手を優先</option><option value="random">ランダム</option><option value="new">まだ解いてない問題</option></select>
        <select id="qNum"><option>10</option><option>20</option><option value="999">全部</option></select>
        <button class="b" id="qStart">スタート</button></div>` : '<p class="muted">まだ問題がありません。下の「問題を追加」から作ってね。</p>'}
      <details><summary class="muted">＋ 問題を追加・まとめて貼り付け</summary>
        <div class="row"><input id="nUnit" placeholder="単元" style="width:110px"><input id="nQ" placeholder="問題" style="flex:1"></div>
        <div class="row"><input id="nA" placeholder="答え" style="flex:1"><input id="nE" placeholder="解説（任意）" style="flex:1"><button class="b" id="nAdd">追加</button></div>
        <p class="muted">まとめて追加：1行に「問題｜答え」または「単元｜問題｜答え｜解説」（区切りは ｜ か タブ）</p>
        <textarea id="bulk" rows="4" style="width:100%" placeholder="例：cell｜細胞"></textarea>
        <button class="g" id="bulkAdd">まとめて追加</button>
        <p class="muted">問題の編集・削除は <a href="${sheetUrl}" target="_blank" rel="noopener">スプレッドシートの「問題」シート</a> から。</p>
      </details>

      <h3>📝 テスト範囲メモ</h3>
      <textarea id="memo" rows="3" style="width:100%" placeholder="例：教科書 p.20〜58、ワーク Lesson3〜5">${esc(memo?.["メモ"] || "")}</textarea>

      <h3>✅ やることリスト</h3>
      <div>${todos.map(t => `
        <div class="todo ${t["完了"]==="TRUE"?"done":""}"><input type="checkbox" data-i="${T("やること").indexOf(t)}" ${t["完了"]==="TRUE"?"checked":""}><span>${esc(t["内容"])}</span><button class="x" data-del="${T("やること").indexOf(t)}">✕</button></div>`).join("") || '<p class="muted">まだありません</p>'}</div>
      <div class="row"><input id="todoIn" placeholder="例：ワーク2周目" style="flex:1"><button class="b" id="todoAdd">追加</button></div>

      <h3>📊 これまでの点数</h3>
      <div class="tw"><table><tr><th></th>${ts.map(t=>`<th>${esc(t)}</th>`).join("")}</tr>
        ${[["素点","素点"],["平均点","素点平均"],["学年順位","学年順位"]].map(([l,k]) => `<tr><td>${l}</td>${ts.map(t=>`<td>${esc(score(s,t)?.[k] || "")}</td>`).join("")}</tr>`).join("")}</table></div>
    </div>`;

  // 一問一答
  if (qs.length) $("#qStart").onclick = () => {
    let pool = qs.filter(q => !$("#qUnit").value || q["単元"] === $("#qUnit").value);
    const mode = $("#qMode").value;
    const r = q => num(q["出題数"]) ? num(q["正解数"]) / num(q["出題数"]) : -1;
    pool = pool.map(q => [q, Math.random()]).sort((a,b) => a[1]-b[1]).map(x => x[0]);
    if (mode === "weak") pool.sort((a,b) => r(a) - r(b));
    if (mode === "new") pool = pool.filter(q => !num(q["出題数"]));
    pool = pool.slice(0, Number($("#qNum").value));
    if (!pool.length) return alert("該当する問題がありません");
    quiz = {list: pool, i: 0, show: false, ok: 0};
    renderSchool(); window.scrollTo(0,0);
  };
  const addQs = list => {
    const rows = S["問題"].rows;
    let n = rows.reduce((m,q) => Math.max(m, parseInt(String(q["ID"]).slice(1)) || 0), 0);
    list.forEach(([u,q,a,e]) => rows.push({"ID":"q"+String(++n).padStart(3,"0"),"教科":s,"単元":u||"","問題":q,"答え":a,"解説":e||"","正解数":"0","出題数":"0","最終学習日":""}));
    save("問題"); renderSchool();
  };
  $("#nAdd").onclick = () => { if (!$("#nQ").value || !$("#nA").value) return alert("問題と答えを入れてね"); addQs([[$("#nUnit").value,$("#nQ").value,$("#nA").value,$("#nE").value]]); };
  $("#bulkAdd").onclick = () => {
    const list = $("#bulk").value.split("\n").map(l => l.split(/[｜|\t]/).map(x => x.trim())).filter(p => p.length >= 2 && p[0]);
    if (!list.length) return;
    addQs(list.map(p => p.length === 2 ? ["",p[0],p[1],""] : [p[0],p[1],p[2]||"",p[3]||""]));
  };

  // メモ・やること
  $("#memo").onchange = e => {
    const rows = S["範囲メモ"].rows, m = rows.find(x => x["教科"] === s);
    if (m) m["メモ"] = e.target.value; else rows.push({"教科":s,"メモ":e.target.value});
    save("範囲メモ");
  };

function renderQuiz(){

      <p>${pct >= 80 ? "🎉 すばらしい！" : pct >= 50 ? "👍 いい調子！まちがえた問題をもう一度やろう" : "💪 苦手な問題を何回もくり返そう"}</p>

      : `<div class="qbtns"><button class="b" id="qShow" style="font-size:18px;padding:12px 28px">答えを見る</button></div>`}
    <p style="margin-top:18px"><button class="g" id="qQuit">やめる</button></p></div>`;
  const mark = ok => {
    q["出題数"] = String((num(q["出題数"]) || 0) + 1);
    if (ok) { q["正解数"] = String((num(q["正解数"]) || 0) + 1); quiz.ok++; }
    q["最終学習日"] = today();
    quiz.i++; quiz.show = false; save("問題"); renderQuiz();
  };
  if (quiz.show) { $("#qOk").onclick = () => mark(true); $("#qNg").onclick = () => mark(false); }
  else $("#qShow").onclick = () => { quiz.show = true; renderQuiz(); };

}

// 定期テスト：1行＝学年×テスト×教科
const SC = ["知識・技能","思考・判断","素点","クラス順位","学年順位","知技平均","思判平均","素点平均"];
const SC_LABEL = ["知技","思判","素点","クラス<br>順位","学年<br>順位","知技<br>平均","思判<br>平均","素点<br>平均"];
const ALIAS = {"英語コミュニケーションI":"英語コミュ", "論理・表現I":"論理・表現"};
const normSubj = name => { const n = String(name).replace(/\s/g,"").replace(/[ⅠＩ]/g,"I"); return ALIAS[n] || subjects().find(s => s === n) || null; };
let recTestSel = null;
function setScore(s, t, k, v){
  const rows = S["定期テスト"].rows;
  let r = score(s, t);
  if (!r) { r = {"学年":GRADE, "テスト":t, "教科":s}; rows.push(r); }
  r[k] = v;
  if ((k === "知識・技能" || k === "思考・判断") && num(r["知識・技能"]) !== null && num(r["思考・判断"]) !== null && !r["素点"])
    r["素点"] = String(num(r["知識・技能"]) + num(r["思考・判断"]));
}
function setTotal(t, k, v){
  const rows = S["総合順位"].rows;
  let r = rows.find(x => String(x["学年"]) === GRADE && x["テスト"] === t);
  if (!r) { r = {"学年":GRADE, "テスト":t}; rows.push(r); }
  r[k] = v;
}
function recTest(){
  const ts = tests(), done = ts.filter(t => T("定期テスト").some(r => String(r["学年"]) === GRADE && r["テスト"] === t && r["素点"]));
  const sel = recTestSel || done[done.length - 1] || ts[0];
  const subs = subjects().filter(s => !na(s, sel));
  const tot = T("総合順位").find(r => String(r["学年"]) === GRADE && r["テスト"] === sel) || {};
  $("#recBody").innerHTML = `
    <div class="card"><h2>📝 定期テスト結果（1年）</h2>
      <div class="row"><select id="tSel">${ts.map(t=>`<option ${t===sel?"selected":""}>${t}</option>`).join("")}</select>
        <span class="muted">入力すると自動保存。素点が空なら知技＋思判で自動計算</span></div>
      <div class="tw"><table><tr><th>教科</th>${SC_LABEL.map(l=>`<th>${l}</th>`).join("")}</tr>
      ${subs.map(s => { const r = score(s, sel) || {}; return `<tr><td>${esc(s)}</td>${SC.map(k =>
        `<td><input type="number" step="0.1" inputmode="decimal" style="width:58px" data-s="${esc(s)}" data-k="${k}" value="${esc(r[k] ?? "")}"></td>`).join("")}</tr>`; }).join("")}
      </table></div>
      <div class="row" style="margin-top:10px"><b>総合</b>　クラス順位 <input type="number" inputmode="numeric" id="tC" style="width:64px" value="${esc(tot["クラス順位"] || "")}">
        コース順位 <input type="number" inputmode="numeric" id="tK" style="width:64px" value="${esc(tot["コース順位"] || "")}"></div>
      <details><summary class="muted">📋 学校のページの表をコピーして貼り付け</summary>
        <p class="muted">成績個人票の表をまるごと選択してコピーし、ここに貼り付けてね。「科目名・知技・思判・素点・クラス順位・学年順位・知技平均・思判平均・素点平均」の順に読み取ります。</p>
        <textarea id="tPaste" rows="5" style="width:100%"></textarea>
        <button class="g" id="tPasteBtn">読み取って「${esc(sel)}」に反映</button></details>
      <p class="muted">成績個人票の画像・PDFは <a href="${driveUrl(DRIVE.recTest)}" target="_blank" rel="noopener">📁 定期テスト結果フォルダ</a> へ。</p>
    </div>
    ${done.includes(sel) ? `<div class="card"><h3>${esc(sel)}：自分の素点と平均点</h3><canvas id="cBar" height="280"></canvas></div>` : ""}
    ${done.length ? `<div class="card"><h3>素点の推移</h3><canvas id="cTest" height="260"></canvas></div>
    <div class="card"><h3>学年順位の推移</h3><canvas id="cRank" height="260"></canvas></div>` : ""}`;

  $("#tSel").onchange = e => { recTestSel = e.target.value; renderRecord(); };
  $("#recBody").querySelectorAll("input[data-k]").forEach(i => i.onchange = () => { setScore(i.dataset.s, sel, i.dataset.k, i.value); save("定期テスト"); renderRecord(); });
  $("#tC").onchange = e => { setTotal(sel, "クラス順位", e.target.value); save("総合順位"); };
  $("#tK").onchange = e => { setTotal(sel, "コース順位", e.target.value); save("総合順位"); };
  $("#tPasteBtn").onclick = () => {
    let n = 0, tn = 0;
    $("#tPaste").value.split("\n").forEach(line => {
      const c = line.split("\t").map(x => x.trim()).filter(x => x !== "");
      if (!c.length) return;
      if (/^クラス順位/.test(c[0]) && c[1]) { setTotal(sel, "クラス順位", c[1]); tn++; return; }
      if (/^コース順位/.test(c[0]) && c[1]) { setTotal(sel, "コース順位", c[1]); tn++; return; }
      const s = normSubj(c[0]), vals = c.slice(1).filter(x => !isNaN(Number(x)));
      if (!s || !vals.length) return;
      vals.slice(0, SC.length).forEach((v, i) => setScore(s, sel, SC[i], v));
      n++;
    });
    if (!n && !tn) return alert("読み取れる行がありませんでした。表の部分をコピーしてね");
    if (n) save("定期テスト"); if (tn) save("総合順位");
    alert(`${n}科目${tn ? "と総合順位" : ""}を反映しました`); renderRecord();
  };

  chart("cBar", {type:"bar", data:{labels:subs, datasets:[
      {label:"自分の素点", data:subs.map(s => num(score(s, sel)?.["素点"]))},
      {label:"平均点", data:subs.map(s => num(score(s, sel)?.["素点平均"]))}]},
    options:{scales:{y:{min:0,max:100}},plugins:{legend}}});
  chart("cTest", {type:"line", data:{labels:done, datasets:subjects().map(s => ({label:s, spanGaps:true, data:done.map(t => num(score(s, t)?.["素点"]))}))},
    options:{scales:{y:{min:0,max:100}},plugins:{legend}}});
  const totals = done.map(t => T("総合順位").find(r => String(r["学年"]) === GRADE && r["テスト"] === t) || {});
  chart("cRank", {type:"line", data:{labels:done, datasets:[
      {label:"総合クラス順位", data:totals.map(r => num(r["クラス順位"])), borderWidth:3},
      {label:"総合コース順位", data:totals.map(r => num(r["コース順位"])), borderWidth:3},
      ...subjects().map(s => ({label:s, spanGaps:true, borderDash:[4,3], data:done.map(t => num(score(s, t)?.["学年順位"]))}))]},
    options:{scales:{y:{reverse:true, min:1}},plugins:{legend}}});
}

    const o = {"級":$("#eG").value,"方式":$("#eM").value,"受験日":$("#eD").value,"結果":$("#eR").value};
    $("#recBody").querySelectorAll("input[data-k]").forEach(i => o[i.dataset.k] = i.value);
    const sc = ["Reading","Listening","Writing","Speaking"].map(k => num(o[k])).filter(x => x !== null);
    o["総合スコア"] = sc.length === 4 ? String(sc.reduce((a,b)=>a+b,0)) : "";
    o["満点"] = {"準1級":"3000","1級":"3400","2級":"2600","準2級プラス":"2500","準2級":"2400","3級":"2200"}[o["級"]];
    rows.push(o); save("英検"); renderRecord();
  };
  const pts = rows.filter(e => e["Reading"]);
  chart("cEiken", {type:"bar", data:{labels:pts.map(e=>e["級"]),
    datasets:["Reading","Listening","Writing","Speaking"].map(k=>({label:k, data:pts.map(e=>num(e[k]))}))},
    options:{scales:{x:{stacked:true},y:{stacked:true}},plugins:{legend,tooltip:{callbacks:{footer:it=>{const e=pts[it[0].dataIndex];return `${e["受験日"]||e["回"]} ${e["結果"]}`;}}}}}});
}
function recIelts(){
  const rows = T("IELTS"), f = ["Overall","Listening","Reading","Writing","Speaking"];
  $("#recBody").innerHTML = `
    <div class="card"><h2>🌍 IELTSの記録</h2>
      <p class="muted"><a href="${driveUrl(DRIVE.recIelts)}" target="_blank" rel="noopener">📁 IELTS結果フォルダ</a></p>
      <div class="tw"><table><tr><th>受験日</th>${f.map(k=>`<th>${k}</th>`).join("")}<th></th></tr>
      ${rows.map((r,i)=>`<tr><td>${esc(r["受験日"])}</td>${f.map(k=>`<td>${esc(r[k])}</td>`).join("")}<td><button class="x" data-del="${i}">✕</button></td></tr>`).join("") || `<tr><td colspan="7" class="muted">まだ記録はありません</td></tr>`}
      </table></div>
      <div class="row"><input type="date" id="iD">${f.map(k=>`<input type="number" step="0.5" min="0" max="9" inputmode="decimal" placeholder="${k}" data-k="${k}" style="width:100px">`).join("")}<button class="b" id="iAdd">追加</button></div>
    </div>`;
  $("#recBody").querySelectorAll("[data-del]").forEach(b => b.onclick = () => { rows.splice(b.dataset.del,1); save("IELTS"); renderRecord(); });
  $("#iAdd").onclick = () => { const o = {"受験日":$("#iD").value}; $("#recBody").querySelectorAll("input[data-k]").forEach(i => o[i.dataset.k] = i.value); rows.push(o); save("IELTS"); renderRecord(); };
}

// ===== ⑤ Info =====
const CATS = {"向上高校":"school", "自習室":"jishu", "その他":"other"};
const jishu = d => T("自習室").find(r => r["日付"] === d);
const jishuText = r => r ? `${r["開室時間"]}${r["備考"] ? "（" + r["備考"] + "）" : ""}` : "情報なし";
function renderInfo(){
  const t = today();
  const week = Array.from({length:7}, (_,i) => new Date(Date.now() + 9*3600e3 + i*864e5).toISOString().slice(0,10));
  const wd = d => "日月火水木金土"[new Date(d + "T00:00:00+09:00").getDay()];
  const mine = T("予定").map((e,i) => ({date:e["日付"], title:e["内容"], cat:e["区分"], idx:i}));
  const tests = T("テスト日程").map(r => ({date:r["開始日"], end:r["終了日"], title:r["テスト"], cat:"向上高校"}));
  const gc = EVENTS.map(e => ({...e, cat:"Google"}));
  const all = [...mine, ...tests, ...gc].filter(e => (e.end || e.date) >= t).sort((a,b) => (a.date + (a.time||"")).localeCompare(b.date + (b.time||"")));
  const md = d => d ? d.slice(5).replace("-","/") : "";
  const evRow = e => `<div class="ev"><span style="width:96px">${md(e.date)}${e.end && e.end !== e.date ? "〜" + md(e.end) : ""}${e.time ? " " + e.time : ""}</span>
    <span class="tag t-${CATS[e.cat] || "gcal"}">${esc(e.cat === "Google" ? e.cal : e.cat)}</span><span style="flex:1">${esc(e.title)}</span>
    ${e.idx !== undefined ? `<button class="x" data-del="${e.idx}">✕</button>` : ""}</div>`;
  $("#tab-info").innerHTML = `
    <div class="card"><h2>🏫 自習室の開室時間</h2>
      ${week.map(d => `<div class="ev"><span style="width:96px">${d.slice(5).replace("-","/")}（${wd(d)}）</span><span class="tag t-jishu">自習室</span><span style="flex:1">${esc(jishuText(jishu(d)))}</span></div>`).join("")}
      <p class="muted">元の予定表は <a href="${driveUrl(DRIVE.calJishu)}" target="_blank" rel="noopener">📁 自習室カレンダー</a></p>
    </div>
    <div class="card"><h2>📅 これからの予定</h2>
      <p class="muted">向上高校のテスト日程・自分で追加した予定・Googleカレンダーの予定をまとめて表示しています。</p>
      ${all.slice(0, 40).map(evRow).join("") || '<p class="muted">予定はありません</p>'}
      <h3>予定を追加</h3>
      <div class="row"><input type="date" id="evD" value="${t}"><select id="evC">${Object.keys(CATS).map(k=>`<option>${k}</option>`).join("")}</select>
        <input id="evT" placeholder="例：進研模試" style="flex:1"><button class="b" id="evAdd">追加</button></div>
    </div>
    <div class="card"><h2>📁 カレンダー資料</h2>
      <p>学校や自主室から配られた予定表（PDF・写真）はこちら：</p>
      <div class="row"><a class="g" style="text-decoration:none;padding:8px 12px" href="${driveUrl(DRIVE.calSchool)}" target="_blank" rel="noopener">📁 向上高校カレンダー</a>
        <a class="g" style="text-decoration:none;padding:8px 12px" href="${driveUrl(DRIVE.calJishu)}" target="_blank" rel="noopener">📁 自習室カレンダー</a>
        <a class="g" style="text-decoration:none;padding:8px 12px" href="https://calendar.google.com/" target="_blank" rel="noopener">🗓 Googleカレンダー</a></div>
    </div>`;
  $("#tab-info").querySelectorAll("[data-del]").forEach(b => b.onclick = () => { S["予定"].rows.splice(b.dataset.del,1); save("予定"); renderInfo(); });
  $("#evAdd").onclick = () => { const v = $("#evT").value.trim(); if (!v || !$("#evD").value) return; S["予定"].rows.push({"日付":$("#evD").value,"区分":$("#evC").value,"内容":v}); save("予定"); renderInfo(); };
}

const RENDER = {school:renderSchool, ielts:renderIelts, kyotsu:renderKyotsu, record:renderRecord, info:renderInfo};
</script>
</body>
